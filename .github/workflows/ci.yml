name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_news_feed_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_news_feed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_news_feed_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_news_feed_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true

      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-groups

      - name: Apply Alembic migrations to PostgreSQL 18
        run: uv run --no-sync alembic upgrade head

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Mypy
        run: uv run --no-sync mypy src

      - name: Pytest including PostgreSQL integration
        run: uv run --no-sync pytest
